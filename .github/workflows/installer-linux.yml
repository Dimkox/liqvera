name: Verify Linux installer contract
on:
  pull_request:
    paths: ["installer/**", "scripts/*liqvera-installer*", "tests/installer/**", "docs/runbooks/**", ".github/workflows/installer-linux.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify installer contract
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.lock
          .venv/bin/python -m pytest -q tests/installer
