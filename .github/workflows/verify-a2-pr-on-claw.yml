name: Verify trusted A2 PR on Claw

on:
  repository_dispatch:
    types:
      - a2-pr-verification

permissions:
  contents: read

concurrency:
  group: a2-claw-pr-verification
  cancel-in-progress: false

jobs:
  verify-a2-pr:
    name: Verify trusted A2 PR (${{ matrix.postgres_name }})
    if: github.actor == github.repository_owner
    runs-on: [self-hosted, claw]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres_name: postgres-16.11
            postgres_shard: postgres_16_11
            postgres_image: postgres:16.11-alpine@sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e2
          - postgres_name: postgres-17.7
            postgres_shard: postgres_17_7
            postgres_image: postgres:17.7-alpine@sha256:bb377b7239d2774ac8cc76f481596ce96c5a6b5e9d141f6d0a0ee371a6e7c0f2
    env:
      BOOTSTRAP_SCOPE: TRANSITIONAL_BOOTSTRAP_DIAGNOSTIC_ONLY
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      TARGET_SHA: ${{ github.event.client_payload.target_sha }}
      POSTGRES_NAME: ${{ matrix.postgres_name }}
      POSTGRES_IMAGE: ${{ matrix.postgres_image }}
      CLAW_WORKSPACE_SHARD: ${{ matrix.postgres_shard }}
    steps:
      - name: Validate trusted PR target
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          job_name="$(printf '%s' "${GITHUB_JOB}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_shard="$(printf '%s' "${CLAW_WORKSPACE_SHARD}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          validation_dir="${workspace_root}/pr-validation-${POSTGRES_NAME}"
          install -d -m 0700 "${validation_dir}"
          response_path="${validation_dir}/pull-request.json"
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --output "${response_path}"
          python3 -B - "${response_path}" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          pull_request = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "state": "open",
              "base.ref": "main",
              "head.repo.full_name": os.environ["GITHUB_REPOSITORY"],
              "head.sha": os.environ["TARGET_SHA"],
          }
          actual = {
              "state": pull_request.get("state"),
              "base.ref": pull_request.get("base", {}).get("ref"),
              "head.repo.full_name": (
                  pull_request.get("head", {}).get("repo") or {}
              ).get("full_name"),
              "head.sha": pull_request.get("head", {}).get("sha"),
          }
          if actual != expected:
              raise SystemExit("pull request target is not trusted")
          PY

      - name: Checkout exact trusted SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.client_payload.target_sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - name: Start isolated PostgreSQL
        id: postgres_runtime
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          job_name="$(printf '%s' "${GITHUB_JOB}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_shard="$(printf '%s' "${CLAW_WORKSPACE_SHARD}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          install -d -m 0700 "${workspace_root}"
          postgres_identity="a2_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${job_name}_${workspace_shard}"
          postgres_container="a2-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          postgres_password="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "${postgres_password}"
          printf 'postgres_password=%s\n' "${postgres_password}" >>"${GITHUB_OUTPUT}"
          env_file="${workspace_root}/postgres-container.env"
          runtime_file="${workspace_root}/postgres-runtime.env"
          printf 'POSTGRES_DB=%s\nPOSTGRES_USER=%s\nPOSTGRES_PASSWORD=%s\n' "${postgres_identity}" "${postgres_identity}" "${postgres_password}" >"${env_file}"
          chmod 0600 "${env_file}"
          docker run --detach --name "${postgres_container}" --env-file "${env_file}" --publish 127.0.0.1::5432 --health-cmd "pg_isready -U ${postgres_identity} -d ${postgres_identity}" --health-interval 5s --health-timeout 3s --health-retries 12 "${POSTGRES_IMAGE}"
          port_projection="$(docker port "${postgres_container}" 5432/tcp)"
          [[ "${port_projection}" =~ ^127\.0\.0\.1:([0-9]{1,5})$ ]]
          postgres_port="${BASH_REMATCH[1]}"
          (( postgres_port >= 1 && postgres_port <= 65535 ))
          printf 'postgres_identity=%q\npostgres_password=%q\npostgres_port=%q\npostgres_container=%q\n'             "${postgres_identity}" "${postgres_password}" "${postgres_port}" "${postgres_container}" >"${runtime_file}"
          chmod 0600 "${runtime_file}"
          for attempt in {1..60}; do
            [[ "$(docker inspect --format '{{.State.Health.Status}}' "${postgres_container}")" == healthy ]] && exit 0
            sleep 1
          done
          exit 2


      - name: Assert exact checkout and origin
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
          test "$(git rev-parse HEAD)" = "${TARGET_SHA}"
          expected_origin="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          actual_origin="$(git remote get-url origin)"
          test "${actual_origin%.git}" = "${expected_origin}"

      - name: Validate architecture graph
        shell: bash
        run: python3 scripts/check-architecture-graph.py --manifest-root architecture --phase merge

      - name: Validate Claw workflow policy
        shell: bash
        run: python3 -m pytest tests/graph/test_workflow_policy.py -q

      - name: Create isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          job_name="$(printf '%s' "${GITHUB_JOB}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_shard="$(printf '%s' "${CLAW_WORKSPACE_SHARD}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          venv_dir="${workspace_root}/a2-pr-venv-${POSTGRES_NAME}"
          python3 -m venv "${venv_dir}"
          "${venv_dir}/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir \
            --no-deps -r requirements-a2.txt
          "${venv_dir}/bin/python" -m pip check

      - name: Run exact A2 and conditional shadow-economics gates
        shell: bash
        run: |
          set -euo pipefail
          job_name="$(printf '%s' "${GITHUB_JOB}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_shard="$(printf '%s' "${CLAW_WORKSPACE_SHARD}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          source "${workspace_root}/postgres-runtime.env"
          A2_TEST_DATABASE_URL="postgresql://${postgres_identity}:${postgres_password}@127.0.0.1:${postgres_port}/${postgres_identity}"
          export A2_TEST_DATABASE_URL
          venv_dir="${workspace_root}/a2-pr-venv-${POSTGRES_NAME}"
          python_bin="${venv_dir}/bin/python"
          "${python_bin}" scripts/run-a2-postgres-tests.py
          "${python_bin}" -B -m unittest discover -s tests/a2 -t . -v
          "${python_bin}" -B -m unittest tests.a2.test_replay -v
          "${python_bin}" -B -m unittest tests.a2.integration.test_fault_matrix -v
          "${python_bin}" scripts/check-a2-boundary.py
          if [[ -d multi_exchange_engine/shadow_economics ]]; then
            test -d tests/shadow_economics
            "${python_bin}" -B -m unittest discover -s tests/shadow_economics -t . -v
          fi

      - name: Validate trusted runtime and cleanup PostgreSQL
        id: cleanup_postgres
        if: always()
        shell: bash
        env:
          TRUSTED_POSTGRES_PASSWORD: ${{ steps.postgres_runtime.outputs.postgres_password }}
        run: |
          set -euo pipefail
          job_name="$(printf '%s' "${GITHUB_JOB}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_shard="$(printf '%s' "${CLAW_WORKSPACE_SHARD}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          postgres_container="a2-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          trusted_secret_invalid=0
          [[ "${TRUSTED_POSTGRES_PASSWORD}" =~ ^[0-9a-f]{64}$ ]] || trusted_secret_invalid=1
          cleanup_failed=0
          docker rm --force "${postgres_container}" >/dev/null 2>&1 || cleanup_failed=1
          test -z "$(docker ps -aq --filter "name=^/${postgres_container}$")" || cleanup_failed=1
          rm -f -- "${workspace_root}/postgres-container.env" "${workspace_root}/postgres-runtime.env"
          if (( trusted_secret_invalid )); then
            echo 'trusted runtime credential missing or malformed' >&2
            exit 2
          fi
          (( cleanup_failed == 0 )) || exit 2
          printf 'cleanup_proven=true\n' >>"${GITHUB_OUTPUT}"

      - name: Write non-authoritative verification status
        if: always() && steps.cleanup_postgres.outputs.cleanup_proven == 'true'
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "### Non-authoritative A2 PR verification status"
            echo "- PR: #${PR_NUMBER}"
            echo "- SHA: ${TARGET_SHA}"
            echo "- PostgreSQL: ${POSTGRES_NAME} (${POSTGRES_IMAGE})"
            echo "- Outcome: ${JOB_STATUS}"
            echo "- authority: NONE"
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Final PostgreSQL cleanup fallback
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          job_name="$(printf '%s' "${GITHUB_JOB}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_shard="$(printf '%s' "${CLAW_WORKSPACE_SHARD}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          postgres_container="a2-pg-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          docker rm --force "${postgres_container}" >/dev/null 2>&1 || true
          test -z "$(docker ps -aq --filter "name=^/${postgres_container}$")"
          rm -f -- "${workspace_root}/postgres-container.env" "${workspace_root}/postgres-runtime.env"


      - name: Cleanup isolated workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          job_name="$(printf '%s' "${GITHUB_JOB}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_shard="$(printf '%s' "${CLAW_WORKSPACE_SHARD}" | tr -c 'A-Za-z0-9._-' '_')"
          workspace_root="${RUNNER_TEMP}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${job_name}-${workspace_shard}"
          scripts/cleanup-claw-workspace.sh "${workspace_root}"
