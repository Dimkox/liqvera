[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "london" # Mezo Testnet MUSD contracts are verified with evmVersion london
optimizer = true
optimizer_runs = 200
fs_permissions = []

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
mezo_testnet = "${MEZO_TESTNET_RPC}"
