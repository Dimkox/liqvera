[project]
name = "mee-evidence-report"
version = "0.1.0"
description = "Fixture-only Liqvera MVP evidence report builder"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Dimkox" },
]
dependencies = [
  "mee-contracts==0.1.0",
  "mee-readonly-analyzer==0.1.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mee_evidence_report"]
