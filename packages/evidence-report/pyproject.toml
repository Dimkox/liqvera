[project]
name = "liqvera-evidence-report"
version = "0.2.0"
description = "Liqvera exact evidence reports, bounded bundles, and offline verifier"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Dimkox" },
]
dependencies = [
  "liqvera-contracts==0.2.0",
  "liqvera-readonly-analyzer==0.2.0",
  "liqvera-public-capture==0.2.0",
  "jsonschema==4.23.0",
  "referencing==0.35.1",
]

[project.scripts]
liqvera-trove-risk = "liqvera_evidence_report.trove_cli:main"
liqvera-evidence-build = "liqvera_evidence_report.evidence_cli:build_main"
liqvera-evidence-verify = "liqvera_evidence_report.evidence_cli:verify_main"
liqvera-evidence-report-service = "liqvera_evidence_report.service:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liqvera_evidence_report"]

[tool.hatch.build.targets.wheel.force-include]
"../../schemas/mezo-evidence/v1" = "liqvera_evidence_report/resources/schemas"
"../mezo-protocol/vendor/Pool.testnet.json" = "liqvera_evidence_report/resources/mezo/Pool.testnet.json"
"../mezo-protocol/vendor/Router.testnet.json" = "liqvera_evidence_report/resources/mezo/Router.testnet.json"
"../mezo-protocol/vendor/PoolFactory.testnet.json" = "liqvera_evidence_report/resources/mezo/PoolFactory.testnet.json"
"../mezo-protocol/vendor/TroveManager.implementation.testnet.json" = "liqvera_evidence_report/resources/mezo/TroveManager.implementation.testnet.json"
"../mezo-protocol/vendor/SortedTroves.implementation.testnet.json" = "liqvera_evidence_report/resources/mezo/SortedTroves.implementation.testnet.json"
"../mezo-protocol/vendor/PriceFeed.implementation.testnet.json" = "liqvera_evidence_report/resources/mezo/PriceFeed.implementation.testnet.json"
