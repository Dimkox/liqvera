[project]
name = "liqvera-public-capture"
version = "0.2.0"
description = "Credential-free public capture distribution"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Dimkox" },
]
dependencies = [
  "liqvera-contracts==0.2.0",
  "httpx==0.28.1",
  "websockets==17.1",
]

[project.scripts]
liqvera-public-capture = "liqvera_public_capture.__main__:main"
liqvera-evidence-capture-service = "liqvera_public_capture.evidence_service:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liqvera_public_capture"]
