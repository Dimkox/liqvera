[project]
name = "liqvera-readonly-analyzer"
version = "0.2.0"
description = "Network-free frozen-package evidence reader"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Dimkox" },
]
dependencies = [
  "liqvera-contracts==0.2.0",
]

[project.scripts]
liqvera-readonly-analyzer = "liqvera_readonly_analyzer.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liqvera_readonly_analyzer"]
