[project]
name = "liqvera"
version = "0.2.0"
description = "Stage A public-evidence workspace: liqvera-contracts, liqvera-public-capture, liqvera-readonly-analyzer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "Dimkox" },
]
dependencies = ["httpx==0.28.1", "websockets==17.2", "jsonschema==4.26.0", "referencing==0.37.0"]

[project.optional-dependencies]
dev = ["pip==26.2.1", "hatchling==1.32.4", "editables==0.6", "PyYAML==6.0.3", "pytest==9.1.1", "pytest-asyncio==1.4.0", "pytest-cov==7.1.0", "ruff==0.17.0"]
audit = ["pip-audit==2.10.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = [
  "tests/compatibility",
  "tests/contracts",
  "tests/public_capture",
  "tests/readonly_analyzer",
  "tests/conformance",
  "tests/installed",
  "tests/artifact",
  "tests/evidence_report",
  "tests/installer",
]
pythonpath = [
  ".",
  "packages/contracts/src",
  "packages/public-capture/src",
  "packages/readonly-analyzer/src",
  "packages/evidence-report/src",
]
addopts = "-m 'not live'"
markers = [
  "live: opt-in test that contacts an external venue",
]

[tool.ruff]
line-length = 100
target-version = "py311"
include = [
  "packages/**/*.py",
  "tests/contracts/**/*.py",
  "tests/public_capture/**/*.py",
  "tests/readonly_analyzer/**/*.py",
  "tests/conformance/**/*.py",
  "tests/evidence_report/**/*.py",
  "tools/mezo_acceptance/**/*.py",
  "scripts/build-liqvera-python-distributions.py",
  "scripts/run-mezo-acceptance.py",
  "scripts/run-mvp-web.py",
  "tools/conformance/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = [
  "liqvera_contracts",
  "liqvera_public_capture",
  "liqvera_readonly_analyzer",
  "liqvera_evidence_report",
  "tools.mezo_acceptance",
]
