[project]
name = "multi-exchange-engine"
version = "0.1.0.dev0"
description = "Stage A public-evidence workspace: mee-contracts, mee-public-capture, mee-readonly-analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Dimkox" },
]
dependencies = [
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "websockets==17.1",
  "orjson==3.12.0",
  "structlog==26.1.0",
  "hyperliquid-python-sdk==0.24.0",
  "eth-account==0.13.7",
  "jsonschema==4.23.0",
  "referencing==0.35.1",
]

[project.optional-dependencies]
# The 27 MB venue SDK is needed only by the authenticated Lighter signer path.
lighter-trading = [
  "lighter-sdk==1.1.4",
]
dev = [
  "PyYAML==6.0.3",
  "hatchling==1.32.4",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
  "mypy==2.3.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = [
  "tests/compatibility",
  "tests/contracts",
  "tests/public_capture",
  "tests/readonly_analyzer",
  "tests/conformance",
  "tests/graph",
  "tests/installed",
  "tests/artifact",
  "tests/evidence_report",
]
pythonpath = [
  ".",
  "packages/contracts/src",
  "packages/public-capture/src",
  "packages/readonly-analyzer/src",
  "packages/evidence-report/src",
]
addopts = "-m 'not live'"
markers = [
  "live: opt-in test that contacts an external venue",
]

[tool.ruff]
line-length = 100
target-version = "py311"
include = [
  "packages/**/*.py",
  "tests/contracts/**/*.py",
  "tests/public_capture/**/*.py",
  "tests/readonly_analyzer/**/*.py",
  "tests/conformance/**/*.py",
  "tests/evidence_report/**/*.py",
  "tools/mezo_acceptance/**/*.py",
  "scripts/build-liqvera-python-distributions.py",
  "scripts/run-mezo-acceptance.py",
  "scripts/run-mvp-web.py",
  "tools/conformance/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = [
  "mee_contracts",
  "mee_public_capture",
  "mee_readonly_analyzer",
  "mee_evidence_report",
  "tools.mezo_acceptance",
]
